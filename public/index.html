<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08111f" />
    <title>ISO Grid</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #08111f;
        --panel: rgba(15, 23, 42, 0.78);
        --panel-border: rgba(226, 232, 240, 0.12);
        --text: #f8fafc;
        --muted: rgba(226, 232, 240, 0.72);
        --accent: #22c55e;
        --accent-2: #38bdf8;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 20% 15%, rgba(56, 189, 248, 0.16), transparent 24%),
          radial-gradient(circle at 85% 85%, rgba(34, 197, 94, 0.14), transparent 22%),
          linear-gradient(180deg, #08111f 0%, #0f172a 100%);
        color: var(--text);
        overflow: hidden;
      }
      body.ready { overflow: auto; }
      .splash,
      .overlay {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .splash {
        z-index: 3;
        transition: opacity 380ms ease, transform 380ms ease;
      }
      .splash.fade-out {
        opacity: 0;
        transform: scale(1.015);
        pointer-events: none;
      }
      .splash-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        text-align: center;
      }
      .splash-mark {
        width: 168px;
        height: 168px;
        border-radius: 40px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.08);
        box-shadow: 0 22px 80px rgba(2, 6, 23, 0.38);
        overflow: hidden;
      }
      .splash-mark img,
      .logo img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .splash-title {
        font-size: 32px;
        line-height: 1.08;
        font-weight: 800;
        margin: 0;
      }
      .splash-subtitle,
      p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }
      .bar {
        width: min(280px, 72vw);
        height: 8px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255,255,255,0.08);
      }
      .bar > span {
        display: block;
        width: 42%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, var(--accent-2), var(--accent));
        animation: pulse 1.4s ease-in-out infinite;
      }
      .tiny {
        margin-top: 14px;
        font-size: 12px;
        color: rgba(226,232,240,0.58);
      }
      .online { color: #86efac; }
      .offline { color: #fdba74; }
      .first-time { color: #93c5fd; }
      .overlay {
        z-index: 2;
        display: none;
      }
      .overlay.show {
        display: grid;
      }
      .message {
        width: min(520px, 100%);
        border: 1px solid rgba(255,255,255,0.10);
        border-radius: 24px;
        background: rgba(15, 23, 42, 0.72);
        backdrop-filter: blur(18px);
        box-shadow: 0 20px 80px rgba(2, 6, 23, 0.45);
        padding: 24px;
      }
      .message h2 {
        margin: 0 0 8px 0;
        font-size: 22px;
      }
      @keyframes pulse {
        0%, 100% { transform: translateX(0); opacity: 0.65; }
        50% { transform: translateX(140%); opacity: 1; }
      }
      @media (max-width: 480px) {
        .splash-mark { width: 140px; height: 140px; }
        .splash-title { font-size: 28px; }
      }
    </style>
  </head>
  <body>
    <main class="splash" id="splash">
      <div class="splash-inner">
        <div class="splash-mark">
          <img src="/icon-192.png" alt="ISO Grid icon" />
        </div>
        <div>
          <h1 class="splash-title">ISO Grid</h1>
          <p class="splash-subtitle">Launching secure workspace...</p>
        </div>
        <div class="bar" aria-hidden="true"><span></span></div>
        <p class="tiny">Checking saved account and brand state</p>
      </div>
    </main>

    <main class="overlay" id="firstTime" hidden>
      <section class="message">
        <h2>Internet needed for first-time load</h2>
        <p id="firstTimeText">Connect once to sign in and cache your brand. After that, the app can reopen much faster on this device.</p>
      </section>
    </main>

    <script>
      const appOrigin = "https://iso-pro-b0grfvh9hcc5chgf.southafricanorth-01.azurewebsites.net";
      const isBundledShell =
        location.protocol === "capacitor:" ||
        location.hostname === "localhost" ||
        location.origin.startsWith("https://localhost");
      const splashDurationMs = 2200;
      const splashEl = document.getElementById("splash");
      const firstTimeEl = document.getElementById("firstTime");
      const firstTimeTextEl = document.getElementById("firstTimeText");

      const LAST_AUTH_USER_KEY = "iso-last-auth-user:v1";
      const LAST_TENANT_KEY = "lastTenantSlug";
      const STAFF_KEY = "active-staff-profile:v1";
      const MOBILE_SHELL_KEY = "__ISO_MOBILE_SHELL__";

      function hasSavedLaunchState() {
        try {
          if (localStorage.getItem(LAST_AUTH_USER_KEY)) return true;
          if (localStorage.getItem(LAST_TENANT_KEY)) return true;
          if (localStorage.getItem(STAFF_KEY)) return true;
          if (localStorage.getItem(MOBILE_SHELL_KEY)) return true;

          for (let index = 0; index < localStorage.length; index += 1) {
            const key = localStorage.key(index) || "";
            if (
              key.startsWith("workspace-cache:v2:") ||
              key.startsWith("audit-template-cache:v1:") ||
              key.startsWith("audit-local-draft:v1:") ||
              key.startsWith("audit-sync-queue:v1") ||
              key.startsWith("template-sync-queue:v1")
            ) {
              return true;
            }
          }
        } catch {
          // ignore storage failures
        }
        return false;
      }

      function openInApp(pathname) {
        if (isBundledShell) {
          const localPath = pathname.endsWith("/") ? pathname : pathname + "/";
          window.location.replace(localPath);
          return;
        }
        window.location.replace(new URL(pathname, appOrigin).toString());
      }

      function showContentAndContinue() {
        splashEl.classList.add("fade-out");
        document.body.classList.add("ready");
        const hasSavedState = hasSavedLaunchState();
        if (hasSavedState) {
          openInApp("/workspace");
          return;
        }

        if (navigator.onLine) {
          openInApp("/login");
          return;
        }

        firstTimeTextEl.textContent = "This device has no saved brand or account yet. Reconnect to load the workspace for the first time.";
        firstTimeEl.hidden = false;
        firstTimeEl.classList.add("show");
      }

      window.addEventListener("online", () => {
        if (!firstTimeEl.hidden) {
          openInApp("/login");
        }
      });

      window.setTimeout(() => {
        showContentAndContinue();
      }, splashDurationMs);
    </script>
  </body>
</html>
