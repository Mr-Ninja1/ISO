<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <title>ISO Pro</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #f8fafc;
        color: #0f172a;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .status {
        max-width: 520px;
        text-align: center;
        line-height: 1.5;
        color: #334155;
      }
      .status strong {
        display: block;
        margin-bottom: 8px;
        color: #0f172a;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <main class="status" id="status">
      <strong>Starting ISO Pro</strong>
      <div id="message">Opening your workspace…</div>
    </main>

    <script>
      const messageEl = document.getElementById("message");

      function hasSavedLaunchState() {
        try {
          const keys = [
            "iso-last-auth-user:v1",
            "lastTenantSlug",
            "active-staff-profile:v1",
            "__ISO_MOBILE_SHELL__",
          ];
          if (keys.some((key) => Boolean(localStorage.getItem(key)))) return true;

          for (let index = 0; index < localStorage.length; index += 1) {
            const key = localStorage.key(index) || "";
            if (
              key.startsWith("workspace-cache:v2:") ||
              key.startsWith("audit-template-cache:v1:") ||
              key.startsWith("audit-sync-queue:v1") ||
              key.startsWith("template-sync-queue:v1") ||
              key.startsWith("audit-local-draft:v1:")
            ) {
              return true;
            }
          }
        } catch {
          // ignore storage failures
        }
        return false;
      }

      function openRoute(pathname) {
        window.location.replace(pathname);
      }

      const hasSavedState = hasSavedLaunchState();

      if (hasSavedState) {
        openRoute("/workspace");
      } else if (navigator.onLine) {
        openRoute("/login");
      } else {
        messageEl.textContent = "Internet is required the first time this app is opened so it can sign in and cache your workspace.";
      }
    </script>
  </body>
</html>
