<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">ISO Grid</title>
  <desc id="desc">ISO Grid brand icon with shield and checkmark.</desc>
  <defs>
    <linearGradient id="bg" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d5c52" />
      <stop offset="1" stop-color="#003d33" />
    </linearGradient>
    <linearGradient id="panel" x1="112" y1="128" x2="400" y2="416" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f2f8f6" />
    </linearGradient>
    <linearGradient id="shield" x1="190" y1="148" x2="322" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ecfeff" />
      <stop offset="1" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="check" x1="194" y1="228" x2="318" y2="324" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34d399" />
      <stop offset="1" stop-color="#16a34a" />
