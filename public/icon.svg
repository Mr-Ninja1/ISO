  <rect width="512" height="512" rx="120" fill="url(#bg)" />
  <g filter="url(#shadow)">
    <rect x="112" y="118" width="288" height="276" rx="52" fill="url(#panel)" />
    <rect x="112" y="118" width="288" height="46" rx="52" fill="#0f172a" opacity="0.9" />
    <path d="M256 160c42 30 84 40 120 48v84c0 78-52 132-120 150-68-18-120-72-120-150v-84c36-8 78-18 120-48Z" fill="url(#shield)" />
    <path d="M216 256l30 30 58-68" fill="none" stroke="url(#check)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
  </g>
