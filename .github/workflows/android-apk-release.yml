# Build Android release APK and attach to a GitHub Release (manual or on tag v*).
name: Android APK release

on:
  workflow_dispatch:
    inputs:
      native_build:
        description: Native build number baked into APK (admin min_native_build should match)
        required: true
        default: "3"
        type: string
  push:
    tags:
      - "v*"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - name: Resolve native build number
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=${{ github.event.inputs.native_build }}" >> "$GITHUB_OUTPUT"
          else
            REF="${GITHUB_REF_NAME}"
            BUILD="${REF##*build}"
            if [ "$BUILD" = "$REF" ]; then BUILD="${{ github.run_number }}"; fi
            echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved native build: $(cat $GITHUB_OUTPUT | grep build=)"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.x"
          package-manager-cache: false

      - name: Install Android SDK (compileSdk 36)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo y | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify google-services.json
        run: |
          test -f android/app/google-services.json
          grep -q 'com.isogrid.app' android/app/google-services.json

      - name: Install dependencies
        run: npm install

      - name: Prepare Gradle
        run: chmod +x android/gradlew

      - name: Build release APK
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://iso-pro-b0grfvh9hcc5chgf.southafricanorth-01.azurewebsites.net
          NEXT_PUBLIC_API_BASE_URL: https://iso-pro-b0grfvh9hcc5chgf.southafricanorth-01.azurewebsites.net
          NEXT_PUBLIC_NATIVE_BUILD: ${{ steps.meta.outputs.build }}
          NEXT_PUBLIC_PUSH_NOTIFICATIONS_ENABLED: "1"
        run: npm run package:apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: iso-grid-apk-build${{ steps.meta.outputs.build }}
          path: dist/iso-grid.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.0-build{0}', steps.meta.outputs.build) }}
          name: ISO Grid Android v1.0 (build ${{ steps.meta.outputs.build }})
          files: dist/iso-grid.apk
          make_latest: true
          body: |
            ## ISO Grid Android (replaces ISO Pro APK)

            - **Package:** `com.isogrid.app` (uninstall old `com.isopro.app` before installing)
            - **Asset:** `iso-grid.apk`
            - **Native build:** `${{ steps.meta.outputs.build }}`
            - **Push notifications:** FCM enabled
            - **API:** https://iso-pro-b0grfvh9hcc5chgf.southafricanorth-01.azurewebsites.net

            ### Admin console after release
            - **Minimum native build:** `${{ steps.meta.outputs.build }}`
            - **Latest APK URL:** `https://github.com/Mr-Ninja1/ISO/releases/latest/download/iso-grid.apk`

            ### Install
            1. Download `iso-grid.apk`
            2. Allow install from browser/files if prompted
            3. Open app → sign in → allow notifications
