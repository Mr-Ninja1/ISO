# Build Android release APK and attach to a GitHub Release (manual or on tag v*).
# Uses only actions/checkout to avoid codeload failures on other marketplace actions.
name: Android APK release

on:
  workflow_dispatch:
    inputs:
      native_build:
        description: Native build number baked into APK (admin min_native_build should match)
        required: true
        default: "3"
        type: string
  push:
    tags:
      - "v*"

jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}

    steps:
      - uses: actions/checkout@v5

      - name: Resolve native build number
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "build=${{ github.event.inputs.native_build }}" >> "$GITHUB_OUTPUT"
          else
            REF="${GITHUB_REF_NAME}"
            BUILD="${REF##*build}"
            if [ "$BUILD" = "$REF" ]; then BUILD="${{ github.run_number }}"; fi
            echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved native build: $(grep build= "$GITHUB_OUTPUT")"

      - name: Toolchain versions
        run: |
          node --version
          java -version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Install Android SDK (compileSdk 36)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          echo y | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Verify google-services.json
        run: |
          test -f android/app/google-services.json
          grep -q 'com.isogrid.app' android/app/google-services.json

      - name: Install dependencies
        run: npm install

      - name: Prepare Gradle
        run: chmod +x android/gradlew

      - name: Build release APK
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SITE_URL: https://iso-pro-b0grfvh9hcc5chgf.southafricanorth-01.azurewebsites.net
          NEXT_PUBLIC_API_BASE_URL: https://iso-pro-b0grfvh9hcc5chgf.southafricanorth-01.azurewebsites.net
          NEXT_PUBLIC_NATIVE_BUILD: ${{ steps.meta.outputs.build }}
          NEXT_PUBLIC_PUSH_NOTIFICATIONS_ENABLED: "1"
        run: npm run package:apk

      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ steps.meta.outputs.build }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="v1.0.0-build${BUILD}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          NOTES_FILE="$(mktemp)"
          cat > "$NOTES_FILE" <<EOF
          ## ISO Grid Android (replaces ISO Pro APK)

          - **Package:** \`com.isogrid.app\` (uninstall old \`com.isopro.app\` before installing)
          - **Asset:** \`iso-grid.apk\`
          - **Native build:** \`${BUILD}\`
          - **Push notifications:** FCM enabled
          - **API:** https://iso-pro-b0grfvh9hcc5chgf.southafricanorth-01.azurewebsites.net

          ### Admin console after release
          - **Minimum native build:** \`${BUILD}\`
          - **Latest APK URL:** \`https://github.com/Mr-Ninja1/ISO/releases/latest/download/iso-grid.apk\`

          ### Install
          1. Download \`iso-grid.apk\`
          2. Allow install from browser/files if prompted
          3. Open app → sign in → allow notifications
          EOF
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/iso-grid.apk --repo "${{ github.repository }}" --clobber
            gh release edit "$TAG" --repo "${{ github.repository }}" --title "ISO Grid Android v1.0 (build ${BUILD})" --notes-file "$NOTES_FILE" --latest
          else
            gh release create "$TAG" dist/iso-grid.apk \
              --repo "${{ github.repository }}" \
              --title "ISO Grid Android v1.0 (build ${BUILD})" \
              --notes-file "$NOTES_FILE" \
              --latest
          fi
