name: Build and deploy Node.js app to Azure Web App - iso-pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .next/standalone
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download standalone artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_573544920FD74219B7E372A2A111E3AE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_93A496B41837400886A6CC0EF868F676 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DFEF0328E0294B11AFAE43FA0B2ECEC4 }}

      - name: Deploy production bundle
        uses: azure/webapps-deploy@v3
        with:
          app-name: "iso-pro"
          slot-name: "Production"
          package: deploy
          startup-command: "node server.js"