# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
#
# IMPORTANT: Do not let Azure Portal "Deployment Center" regenerate this file.
# Portal stubs only zip source (no npm build) and finish in ~2–3 minutes without updating the site.

name: Build and deploy Node.js app to Azure Web App - iso-pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build OTA bundle + production website
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          CI: true
          NEXT_PUBLIC_API_BASE_URL: https://iso-pro-b0grfvh9hcc5chgf.southafricanorth-01.azurewebsites.net
          NEXT_PUBLIC_NATIVE_BUILD: "1"
          APP_BUNDLE_LABEL: deploy-${{ github.run_number }}
          OTA_BUNDLE_ID: ci.${{ github.run_number }}
          OTA_PUBLIC_BASE_URL: https://iso-pro-b0grfvh9hcc5chgf.southafricanorth-01.azurewebsites.net/ota/production
          OTA_CHANNEL: production
          OTA_MIN_NATIVE_BUILD: "1"
          OTA_RELEASE_NOTES: Deploy ${{ github.sha }} (run ${{ github.run_number }})
          SKIP_CAP_SYNC: "1"
        run: |
          set -euo pipefail

          echo "=== Building OTA bundle for native apps ==="
          npm run release:ota:ci
          ls -la public/ota/production/
          test -f public/ota/production/manifest.json
          # Linux CI packs as .ota (Azure ZipDeploy drops nested .zip files)
          if [ -f "public/ota/production/bundle-ci.${{ github.run_number }}.ota" ]; then
            echo "OTA archive: bundle-ci.${{ github.run_number }}.ota"
          elif [ -f "public/ota/production/bundle-ci.${{ github.run_number }}.zip" ]; then
            echo "OTA archive: bundle-ci.${{ github.run_number }}.zip"
          else
            echo "OTA archive missing for run ${{ github.run_number }}"
            ls -la public/ota/production/ || true
            exit 1
          fi

          echo "=== Building hosted website (standalone) ==="
          npm run build

          if [ ! -f ".next/standalone/server.js" ]; then
            echo "standalone server.js missing after build"
            exit 1
          fi
          if [ ! -d ".next/static" ]; then
            echo ".next/static missing after build"
            exit 1
          fi

          npm run test --if-present

      - name: Prepare standalone deployment package
        run: |
          set -euo pipefail
          rm -rf deploy-bundle
          mkdir -p deploy-bundle/.next
          cp -R .next/standalone/. deploy-bundle/
          cp -R .next/static deploy-bundle/.next/static
          cp -R public deploy-bundle/public

          if [ ! -f deploy-bundle/server.js ]; then
            echo "standalone server.js missing in deploy-bundle"
            exit 1
          fi
          if [ ! -d deploy-bundle/.next/static ]; then
            echo ".next/static missing in deploy-bundle"
            exit 1
          fi

          echo "OTA files included in deploy:"
          ls -la deploy-bundle/public/ota/production/ || true

          # Azure App Service runs npm start — point it at the standalone server.
          node -e "const fs=require('fs'); const p='deploy-bundle/package.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); j.scripts={...(j.scripts||{}),start:'node server.js'}; fs.writeFileSync(p, JSON.stringify(j,null,2));"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy-bundle
          # Required: .next/static is a hidden path; without this, deploy gets server.js but no CSS/JS.
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: deploy

      - name: Verify deploy package
        run: |
          set -euo pipefail
          ls -la deploy
          test -f deploy/server.js || { echo "missing server.js"; exit 1; }
          test -d deploy/public || { echo "missing public/"; exit 1; }
          if [ ! -d deploy/.next/static ]; then
            echo "missing .next/static — artifact likely uploaded without include-hidden-files"
            ls -la deploy/.next 2>/dev/null || true
            find deploy -maxdepth 3 -type d | sort
            exit 1
          fi
          echo "Deploy package OK"
          du -sh deploy deploy/.next/static deploy/public | cat

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_573544920FD74219B7E372A2A111E3AE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_93A496B41837400886A6CC0EF868F676 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_DFEF0328E0294B11AFAE43FA0B2ECEC4 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'iso-pro'
          slot-name: 'Production'
          package: deploy
          startup-command: 'node server.js'
